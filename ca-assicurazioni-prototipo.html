<style>
:root{--o:cubic-bezier(.23,1,.32,1);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:#F8F9FA;color:#111827;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{cursor:pointer}
.btn{transition:transform 140ms var(--o),background-color 160ms ease,box-shadow 160ms ease}
.btn:active{transform:scale(.97)}
:focus-visible{outline:2px solid #0F797E;outline-offset:2px;border-radius:8px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page{animation:in 240ms var(--o) both}
.st>*{animation:in 300ms var(--o) both;animation-delay:calc(var(--i,0)*50ms)}
.mega{transform-origin:top left;transition:opacity 180ms var(--o),transform 180ms var(--o),visibility 180ms;opacity:0;transform:scale(.96) translateY(-4px);visibility:hidden}
.mega.open{opacity:1;transform:none;visibility:visible}
.acc{display:grid;grid-template-rows:0fr;transition:grid-template-rows 220ms var(--o)}
.acc.open{grid-template-rows:1fr}
.drawer{transition:transform 260ms cubic-bezier(.32,.72,0,1);transform:translateX(100%)}
.drawer.open{transform:none}
@media (hover:hover) and (pointer:fine){.lift{transition:transform 200ms var(--o),box-shadow 200ms var(--o),border-color 160ms ease}.lift:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(17,24,39,.1);border-color:#128D92}.btn.p:hover{background:#00CC88}}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;transition-duration:1ms!important}.lift:hover{transform:none}}
</style>

    <div className="space-y-6"><h3 className="text-2xl font-semibold tracking-tight leading-8">I Pacchetti Integrati</h3><div className="grid sm:grid-cols-2 gap-6">{PKG.map(x=><button key={x.id} aria-pressed={sel[x.id]} onClick={()=>setSel({...sel,[x.id]:!sel[x.id]})} className={`btn text-left rounded-3xl bg-white border border-[#E5E7EB] p-6 flex flex-col gap-4 transition-shadow duration-150 ${sel[x.id]?'ring-2 ring-[#128D92]':''}`}><div className="flex justify-between items-center w-full"><Ic n={pkIc[x.id]} s={28} c="#128D92"/><span className="text-sm rounded-full bg-[#E7F4F4] text-[#0F797E] px-2 py-1">{x.off}% Sconto</span></div><span className="flex gap-2 items-center text-xl font-semibold tracking-tight">Pacchetto {x.n.split(' ')[1]} <Tip t="Le coperture sono attivabili singolarmente o in combinazione."/></span><span className="space-y-1 block">{x.it.map(t=><Bul key={t} t={t} c="#128D92"/>)}</span></button>)}</div></div>
    <div className="space-y-6"><div><h3 className="text-2xl font-semibold tracking-tight leading-8">Garanzie Opzionali Singole</h3><p>Aggiungibili alla sola RCA o a qualsiasi pacchetto.</p></div><div className="grid sm:grid-cols-2 gap-6">{SING.map(([n,v,ic])=><button key={n} aria-pressed={!!sg[n]} onClick={()=>setSg({...sg,[n]:!sg[n]})} className={`btn text-left flex gap-4 items-center rounded-3xl bg-white border border-[#E5E7EB] p-4 transition-shadow duration-150 ${sg[n]?'ring-2 ring-[#128D92]':''}`}><Ic n={ic} s={28} c="#128D92"/><b className="flex-1 flex gap-2 items-center">{n} <Tip t="Garanzia opzionale aggiungibile alla RC Auto."/></b></button>)}</div></div></section>
   <section className="space-y-4"><div className="rounded-3xl text-white overflow-hidden grid lg:min-h-[360px]" style={{backgroundImage:'linear-gradient(159deg,#111827 15%,#0B595C 85%)'}}>{slides.map(([bd,t1,t2,sb,bl,ic],j)=><div key={j} aria-hidden={sl!==j} style={{transitionTimingFunction:'var(--o)'}} className={`[grid-area:1/1] flex items-stretch transition-[opacity,transform,visibility] duration-300 ${sl===j?'opacity-100 translate-x-0':'opacity-0 invisible translate-x-4'}`}><div className="flex-1 min-w-0 flex flex-col justify-center gap-4 p-6 lg:pl-10 lg:pr-8 2xl:pl-20 2xl:pr-20 lg:py-12"><span className="self-start rounded-full bg-[#ECFDF5] text-[#0F797E] text-sm px-2 py-1">{bd}</span><div><h3 className="text-[28px] leading-9 lg:text-[32px] lg:leading-10 font-semibold tracking-[-0.01em]">{t1}<span>{t2}</span></h3><p className="mt-2">{sb}</p></div><div className="space-y-1">{bl.map(t=><Bul key={t} t={t} c="#fff"/>)}</div></div><div className="hidden md:block w-[30%] max-w-[354px] shrink-0 overflow-hidden bg-[#E5E7EB] [border-radius:16px_0_0_99px]"><img src={IMG[ic]} alt="" className="w-full h-full object-cover"/></div></div>)}</div>
    <div className="flex justify-between items-center"><Arrow dir="l" on={sl>0} onClick={()=>setSl(Math.max(0,sl-1))}/><Dots i={sl} n={3}/><Arrow dir="r" on={sl<2} onClick={()=>setSl(Math.min(2,sl+1))}/></div></section></div>
  <aside className="lg:sticky lg:top-28"><form onSubmit={sub} noValidate className="rounded-3xl bg-white border border-[#E5E7EB] shadow-[0_8px_12px_rgba(17,24,39,.1)] p-6 lg:p-8 flex flex-col gap-6"><div className="pt-3 space-y-1"><h2 className="text-2xl font-semibold tracking-tight leading-8">Richiedi una quotazione</h2><p className="text-[#4B5563]">Il tuo preventivo in 3 dati, senza impegno.</p></div>
   <div className="space-y-3"><div className="grid grid-cols-2 gap-3">{fld('t','Targa','AB123CD')}{fld('d','Data di nascita','gg/mm/aaaa')}</div>{fld('m','E-mail','Inserisci la tua e-mail')}</div>
   <div className="flex items-center gap-4 rounded-3xl border border-[#128D92] bg-[#E7F4F4] px-4 py-2"><Ic n="profile" s={36}/><div className="flex-1 min-w-0"><b className="block font-medium">Sei già cliente Crédit Agricole?</b><span className="text-[#4B5563] flex items-center gap-1">Tariffa riservata attiva <Tip t="Tariffa riservata ai clienti Crédit Agricole Italia."/></span></div><button type="button" role="switch" aria-checked={f.c} aria-label="Cliente Crédit Agricole" onClick={()=>setF({...f,c:!f.c})} className={`relative w-12 h-7 rounded-full shrink-0 transition-colors duration-200 ${f.c?'bg-[#0F797E]':'bg-[#9CA3AF]'}`}><span className="absolute top-0.5 left-0.5 w-6 h-6 rounded-full bg-white transition-transform duration-200" style={{transform:f.c?'translateX(20px)':'none'}}/></button></div>
   <div className="border-t border-[#E5E7EB] pt-6 space-y-2">{ok?<div className="page rounded-2xl bg-[#ECFDF5] border border-[#047857] text-[#047857] p-4 text-sm"><b>Preventivo pronto: {eur(ok)}/anno</b><br/>Riepilogo inviato a {f.m}. Rif. QT-{20260000+ok}.<A to="/preventivo/veicolo" className="block mt-2 underline">Procedi all’acquisto →</A></div>:<Btn type="submit" disabled={busy} className="w-full">{busy?'Calcolo in corso…':<><Ic n="doc" s={20}/>Fai un preventivo</>}</Btn>}</div>
   <p className="flex gap-2 items-center justify-center text-sm text-[#4B5563]"><Ic n="lock" s={24}/>Dati protetti e trattati secondo il GDPR.</p></form></aside></div>
  <Faq docs/><BandTeal/><Svc lst/></div></Wrap><div className="h-8 lg:h-16"/></div>}

function Quote(){const[k,setK]=useState(null),[st,setSt]=useState(0),[t,setT]=useState(''),[r,setR]=useState(null);const O=[['Auto','Targa e dati del proprietario','car',312],['Moto','Moto e ciclomotori','car',176],['Altri veicoli','Camper, furgoni e quadricicli','car',398]];
 const calc=()=>{if(!/^[A-Z]{2}\d{3}[A-Z]{2}$/i.test(t.trim()))return setR('err');setR('load');setTimeout(()=>setR(O[k][3]),900)};
 return <div className="page"><Wrap className="py-12 lg:py-16"><div className="text-center max-w-[846px] mx-auto"><h1 className="text-[32px] leading-10 lg:text-[40px] lg:leading-[48px] font-bold tracking-tight">Proteggi ciò che conta davvero, <span className="text-[#0F797E]">in pochi semplici passi.</span></h1><p className="mt-3 text-[#4B5563]">Calcola un preventivo personalizzato per il tuo veicolo.</p></div>
  <div className="grid md:grid-cols-3 gap-6 mt-10 st">{O.map(([n,d,i],j)=><button key={n} style={{'--i':j}} aria-pressed={k===j} onClick={()=>{setK(j);setR(null)}} className={`lift btn text-left rounded-3xl bg-white p-6 border-2 ${k===j?'!border-[#128D92] shadow-[0_8px_12px_rgba(17,24,39,.1)]':'border-[#E5E7EB]'}`}><div className="flex justify-between"><div className="h-[75px] w-[120px] rounded-3xl bg-[#E7F4F4] grid place-items-center"><Ic n={i} s={36} c="#0B595C"/></div><span className="transition-colors duration-150" style={{color:k===j?'#128D92':'#9CA3AF'}}><Ic n="tickq" s={40}/></span></div><h3 className="text-2xl font-semibold tracking-tight mt-4">{n} <Tip t="Seleziona la tipologia di veicolo da assicurare."/></h3><p className="text-sm text-[#4B5563]">{d}</p></button>)}</div>
  <div className="flex justify-center mt-10"><Btn disabled={k===null||st===1} onClick={()=>setSt(1)} className="w-[200px]">Continua</Btn></div>
  {st===1&&k!==null&&<div className="page max-w-[560px] mx-auto mt-10 rounded-3xl bg-white border border-[#E5E7EB] p-6 space-y-4"><h2 className="text-2xl font-semibold tracking-tight">Dati del veicolo — {O[k][0]}</h2>
   <label className="block text-sm font-medium">Targa<input value={t} onChange={e=>setT(e.target.value.toUpperCase())} maxLength={7} placeholder="AB123CD" aria-invalid={r==='err'} className={`mt-1 w-full h-12 rounded-xl border px-4 outline-none focus:ring-2 focus:ring-[#0F797E]/20 focus:border-[#0F797E] ${r==='err'?'border-[#B91C1C]':'border-[#6B7280]'}`}/>{r==='err'&&<span className="text-xs text-[#B91C1C]">Formato non valido: due lettere, tre numeri, due lettere.</span>}</label>
   <Btn onClick={calc} disabled={r==='load'} className="w-full">{r==='load'?'Calcolo in corso…':'Calcola il tuo preventivo'}</Btn>
   {typeof r==='number'&&<div className="page rounded-2xl bg-[#E7F4F4] p-5"><span className="text-xs font-semibold text-[#0B595C]">Il tuo preventivo per {t}</span><div className="text-4xl font-bold mt-1">{eur(r)}<small className="text-base font-normal text-[#4B5563]"> /anno</small></div><p className="text-sm text-[#4B5563] mt-1">Pari a {eur(Math.round(r/12))} al mese, senza interessi. RC Auto inclusa, massimale 20M€.</p><div className="flex gap-2 mt-4 flex-wrap"><Btn to="/auto/protezione-guida">Personalizza</Btn><Btn v="s" onClick={()=>{setSt(0);setK(null);setR(null);setT('')}}>Ricomincia</Btn></div></div>}</div>}</Wrap></div>}

/* ---------- Configuratore: step 1 (categoria) e step 2 (polizza) ---------- */
const TickSq=({on})=><svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d={IC.tickq[1][0]} fill={on?'#128D92':'none'} stroke="#128D92" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style={{transition:'fill 150ms ease'}}/><path d={IC.tickq[1][1]} stroke={on?'#fff':'transparent'} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style={{transition:'stroke 150ms ease'}}/></svg>;
const SelCard=({on,onClick,im,t,d,tip,i})=><button role="radio" aria-checked={on} onClick={onClick} style={{'--i':i}} className="btn text-left rounded-3xl border border-[#111827] bg-white p-6 flex flex-col gap-4 transition-shadow duration-200 hover:shadow-[0_8px_24px_rgba(17,24,39,.1)]"><span className="self-end"><TickSq on={on}/></span><div className="h-[75px] flex items-center"><img src={im} alt="" className="h-full w-auto"/></div><div><h3 className="text-2xl font-semibold tracking-tight leading-8 flex gap-2 items-center">{t}<Tip t={tip}/></h3><p className="text-sm text-[#4B5563] mt-1">{d}</p></div></button>;
const Step=({title,sub,children,onGo,msg})=><div className="page"><Wrap className="py-14 lg:py-20 flex flex-col items-center gap-10 lg:gap-12"><div className="text-center space-y-2 max-w-[846px]"><h1 className="text-[32px] leading-10 lg:text-[40px] lg:leading-[48px] font-bold tracking-[-0.015em]">{title}</h1><p>{sub}</p></div>{children}<div className="space-y-3 text-center"><Btn className="w-[200px]" onClick={onGo}><Ic n="right" s={20}/>Procedi</Btn>{msg&&<p role="status" className="page text-sm text-[#4B5563] max-w-sm">{msg}</p>}</div></Wrap></div>;
const ENT=[['sCar','Veicoli e Mobilità','Auto, moto e altri veicoli: RC Auto, Kasko e garanzie su misura.'],['sHouse','Casa e Famiglia','Proteggi la casa e chi ami con coperture per ogni imprevisto.'],['sHealth','Persona e Salute','Infortuni, salute e tutela legale per te e la tua famiglia.'],['sBiz','Business e Impresa','Soluzioni assicurative per professionisti, negozi e imprese.']];
const qn=()=>Math.min(3,Math.max(0,+(new URLSearchParams(location.hash.split('?')[1]||'').get('c')||0)));
function Entry(){const[k,setK]=useState(qn());
 return <Step title={<>Cosa vuoi <span className="text-[#0F797E]">assicurare?</span></>} sub="Polizze pensate per ogni esigenza, con la solidità del Gruppo Crédit Agricole." onGo={()=>go('/preventivo/polizza?c='+k)}>
  <div role="radiogroup" aria-label="Cosa vuoi assicurare" className="grid sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full max-w-[1280px] st">{ENT.map(([im,t,d],j)=><SelCard key={t} i={j} on={k===j} onClick={()=>setK(j)} im={IMG[im]} t={t} d={d} tip="Seleziona la categoria che vuoi assicurare."/>)}</div></Step>}
const POL=[
 {sub:'Scegli la polizza auto più adatta alle tue esigenze: RC Auto sempre inclusa e garanzie facoltative solo quando servono.',im:['l1','l2','l3'],it:[['Protezione Guida','La polizza RC Auto personalizzabile con garanzie opzionali per veicolo e persona, con un’app dedicata.'],['Auto Protetta 24/7','Una copertura dedicata alla protezione dell’autovettura, nuova o usata, con assistenza sempre attiva.'],['Agos Safe 2.0 - Auto','L’offerta per l’auto a marchio Honda acquistata presso un concessionario, con copertura dedicata.']]},
 {sub:'Scegli la nostra polizza per proteggere la tua casa e garantire maggiore tranquillità alla tua famiglia. Con la garanzia PET puoi proteggere anche i tuoi animali domestici.',im:['sHouse','sHouse','sHouse'],it:[['Casa Protetta','La polizza casa che protegge i beni del tuo immobile e la tua famiglia'],['Casa e Famiglia perTe','La polizza casa che tutela il contenuto della tua abitazione e la serenità della tua famiglia'],['Protezione Vivi Casa','Dedicata alla protezione dell’abitazione e delle persone che vi risiedono, inclusi gli animali domestici.']]},
 {sub:'Scegli la protezione per te e per la tua famiglia, con coperture modulari per infortuni, salute e tutela legale.',im:['sHealth','sHealth','sHealth'],it:[['Infortuni Protetto','Indennizzi in caso di infortunio, a casa, al lavoro e nel tempo libero.'],['Salute Più','Rimborso delle spese mediche e diaria da ricovero per te e per i tuoi cari.'],['Tutela Legale Famiglia','Assistenza legale e spese coperte per le controversie della vita quotidiana.']]},
 {sub:'Scegli la soluzione per proteggere la tua attività, i tuoi beni e chi lavora con te.',im:['sBiz','sBiz','sBiz'],it:[['Negozio e Studio','Copertura di locali, merci e attrezzature per commercianti e professionisti.'],['Impresa Sicura','Protezione completa per la tua impresa, dai danni ai beni alla responsabilità civile.'],['Flotte Aziendali','Soluzioni su misura per i veicoli aziendali, con assistenza dedicata.']]}];
function Policy(){const c=qn(),D=POL[c],[k,setK]=useState(0),[msg,setMsg]=useState('');
 return <Step title={<>Scegli la tua <span className="text-[#0F797E]">polizza?</span></>} sub={D.sub} msg={msg} onGo={()=>c===0?go('/preventivo/veicolo'):setMsg('Nel prototipo il configuratore completo è disponibile per Auto: prova con Veicoli e Mobilità.')}>
  <div role="radiogroup" aria-label="Scegli la tua polizza" className="grid md:grid-cols-3 gap-6 w-full max-w-[1280px] st">{D.it.map(([t,d],j)=><SelCard key={t} i={j} on={k===j} onClick={()=>{setK(j);setMsg('')}} im={IMG[D.im[j]]} t={t} d={d} tip="Maggiori informazioni sulla polizza."/>)}</div></Step>}
const FooterMini=()=><footer className="text-white" style={{backgroundImage:'linear-gradient(176deg,#0B595C 15%,#0F797E 85%)'}}><Wrap className="!px-4 lg:!px-20 py-8 flex flex-col lg:flex-row gap-4 lg:gap-6"><img src={IMG.logo} alt="Crédit Agricole Assicurazioni" width="193" height="26" className="h-[26px] w-[193px] object-contain shrink-0 brightness-0 invert"/><div className="text-xs leading-4"><p>© 2026 Crédit Agricole Assicurazioni S.p.A.</p><p>Società soggetta all’attività di direzione e coordinamento di Crédit Agricole Assurances S.A. Autorizzata all’esercizio delle assicurazioni con provvedimento IVASS n. 2.248 del 22/03/2012. Iscritta all’Albo delle Imprese di Assicurazione al n. 2.00221. Sede Legale: Via Riviera di Chiaia, 72 — 80122 Napoli. Capitale sociale: € 50.000.000,00 i.v.</p></div></Wrap></footer>;

/* ---------- App ---------- */
function App(){const[h,setH]=useState(location.hash.slice(1)||'/');useEffect(()=>{const f=()=>setH(location.hash.slice(1)||'/');addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
 React.useLayoutEffect(()=>{if('scrollRestoration' in history)history.scrollRestoration='manual';window.scrollTo({top:0,left:0,behavior:'instant'})},[h]);
 const p=h.split('?')[0].split('/').filter(Boolean);let pg;
 if(!p.length)pg=<Home/>;else if(p[0]==='preventivo')pg=p[1]==='veicolo'?<Quote/>:p[1]==='polizza'?<Policy key={h}/>:<Entry key={h}/>;else if(p[0]==='auto'&&p[1])pg=<Pdp key={p[1]} id={p[1]}/>;else pg=<Listing/>;
 return <><Header/><main>{pg}</main>{p[0]==='preventivo'&&p[1]!=='veicolo'?<FooterMini/>:<Footer/>}{p[0]!=='preventivo'&&<Sticky/>}</>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
